[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eaf-twin"
version = "0.1.0"
description = "Multi-fidelity EAF digital-twin benchmark for reproducible evaluation of control and agentic AI policies"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Vahid Tavakkoli", email = "vahid.tavakkoli@aau.at" },
  { name = "Kabeh Mohsenzadegan", email = "kabeh.mohsenzadegan@aau.at" },
  { name = "Kyandoghere Kyamakya", email = "kyandoghere.kyamakya@aau.at" }
]
keywords = [
  "electric arc furnace",
  "digital twin",
  "agentic AI",
  "steelmaking",
  "reinforcement learning",
  "model predictive control",
  "industrial AI",
  "benchmark"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "numpy==2.1.3",
  "pandas==2.2.3",
  "matplotlib==3.9.2",
  "scipy==1.14.1",
  "torch==2.5.1"
]

[project.scripts]
eaf-twin = "eaf_twin.cli:main"

[project.urls]
Repository = "https://github.com/vtavakkoli/eaf-cognitive-twin"
Documentation = "https://github.com/vtavakkoli/eaf-cognitive-twin/tree/main/docs"
Issues = "https://github.com/vtavakkoli/eaf-cognitive-twin/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
