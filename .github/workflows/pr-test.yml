name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile source tree
        run: python -m compileall -q src agents

      - name: Verify CLI entry point
        run: eaf-twin --help

      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Short simulation smoke test
        run: |
          cat > ci_config.json <<'JSON'
          {
            "heat_duration_min": 8.0,
            "dt_s": 2.0,
            "measurement_noise_std": 0.0
          }
          JSON
          eaf-twin run --config ci_config.json --output-dir ci_outputs

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-outputs
          path: ci_outputs/
          if-no-files-found: warn
          retention-days: 7
